<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>{% block title %}重试 5xx 日志分析{% endblock %}</title>
{% block head %}{% endblock %}
<style>
 body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:#0f1420;color:#dbe2f0}
 a{color:#7db4ff;text-decoration:none}
 header{background:#161d31;padding:12px 24px;border-bottom:1px solid #2a3350}
 header a{color:#dbe2f0;font-weight:600}
 main{padding:20px 24px;max-width:1200px;margin:0 auto}
 h1{font-size:20px} h2{font-size:15px;margin:6px 0}
 table{border-collapse:collapse;width:100%;margin-top:8px;font-size:13px}
 th,td{border:1px solid #2a3350;padding:6px 9px;text-align:left}
 th{background:#1a2340}
 .badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600}
 .b-ok{background:#123d2b;color:#4ade80}.b-dead{background:#4a1620;color:#f87171}
 .b-run{background:#3a2f0b;color:#fbbf24}.b-done{background:#123d2b;color:#4ade80}
 .cell-ok{background:#14532d}.cell-lost{background:#7f1d1d}.cell-none{background:#1f2937}
 td.c{width:34px;text-align:center;color:#e5e7eb;font-size:11px}
 button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer}
 button.danger{background:#dc2626}
 button:disabled{background:#374151;cursor:not-allowed}
 .card{background:#161d31;border:1px solid #2a3350;border-radius:8px;padding:14px 18px;margin-top:16px}
 .muted{color:#8b94ad;font-size:12px}
 .events{font-family:ui-monospace,monospace;font-size:12px;max-height:320px;overflow:auto}
 .events div{padding:2px 0;border-bottom:1px solid #1d2742}
 label{margin-right:14px}
</style>
</head>
<body>
<header><a href="/">重试后仍 5xx 请求分析台</a></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
